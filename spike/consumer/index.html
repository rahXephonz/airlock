<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Airlock spike — consumer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;600&display=swap">
<link rel="stylesheet" href="/probe.css">
</head>
<body class="m-0 p-5 max-w-[820px] text-[14px] leading-[1.55]">
<h1 class="text-[15px] font-mono font-semibold m-0 mb-0.5">consumer origin — Airlock spike</h1>
<div class="text-ink-3 text-[13px] max-w-[72ch]" id="origin" class="font-mono text-[12.5px] text-ink-3"></div>

<button id="probe" class="font-sans text-[13px] bg-panel-2 text-ink border border-seam-2 rounded-[2px] px-3 py-1.5 cursor-pointer hover:border-[#3a4b5c] transition-colors mr-2 mt-2">1. probe capabilities</button>
<button id="cross" class="font-sans text-[13px] bg-panel-2 text-ink border border-seam-2 rounded-[2px] px-3 py-1.5 cursor-pointer hover:border-[#3a4b5c] transition-colors mr-2 mt-2">2. getTools({ fromOrigins })</button>
<button id="exec" class="font-sans text-[13px] bg-panel-2 text-ink border border-seam-2 rounded-[2px] px-3 py-1.5 cursor-pointer hover:border-[#3a4b5c] transition-colors mr-2 mt-2">3. executeTool (cross-origin)</button>
<button id="bare" class="font-sans text-[13px] bg-panel-2 text-ink border border-seam-2 rounded-[2px] px-3 py-1.5 cursor-pointer hover:border-[#3a4b5c] transition-colors mr-2 mt-2">4. bare getTools() — agent's view</button>
<button id="revoke" class="font-sans text-[13px] bg-panel-2 text-ink border border-seam-2 rounded-[2px] px-3 py-1.5 cursor-pointer hover:border-[#3a4b5c] transition-colors mr-2 mt-2">5. abort controller — does unregister work</button>

<h2 class="font-mono text-[11px] font-medium tracking-[0.16em] uppercase text-ink-3 mt-5 mb-1.5 border-t border-seam pt-2.5">provider in iframe allow="tools"</h2>
<iframe id="frame" class="w-full h-[190px] border border-seam rounded-[3px] bg-panel mt-2" src="https://airlock-spike-provider.netlify.app" allow="tools"></iframe>

<h2 class="font-mono text-[11px] font-medium tracking-[0.16em] uppercase text-ink-3 mt-5 mb-1.5 border-t border-seam pt-2.5">result</h2>
<div id="log" class="font-mono text-[12.5px] whitespace-pre-wrap"></div>

<script type="module">
const PROVIDER = 'https://airlock-spike-provider.netlify.app';
const TONE = { ok: 'text-trusted', bad: 'text-blocked', warn: 'text-semi', hdr: 'text-semi mt-2' };
const logEl = document.getElementById('log');
document.getElementById('origin').textContent = location.origin;

function log(msg, cls = '') {
  const line = document.createElement('div');
  if (TONE[cls]) line.className = TONE[cls];
  line.textContent = msg;
  logEl.appendChild(line);
}

// Register a top-level tool so ChatGPT's in-app browser has something to discover
// even where iframes and fromOrigins are unsupported.
if (document.modelContext?.registerTool) {
  try {
    await document.modelContext.registerTool({
      name: 'spike_local_ping',
      description: 'Return a fixed string from the Airlock consumer origin. Proves top-level tool registration works in this browser.',
      inputSchema: { type: 'object', properties: {}, additionalProperties: false },
      annotations: { readOnlyHint: true },
      execute: async () => `pong from ${location.origin}`
    });
    log('top-level spike_local_ping registered', 'ok');
  } catch (err) {
    log(`top-level register failed: ${err?.message ?? err}`, 'bad');
  }
}

document.getElementById('probe').onclick = () => {
  const mc = document.modelContext;
  log('--- capability probe ---', 'hdr');
  log(`document.modelContext: ${typeof mc}`);
  if (!mc) { log('no WebMCP in this browser', 'bad'); return; }
  for (const m of ['registerTool', 'getTools', 'executeTool', 'addEventListener']) {
    log(`  ${m}: ${typeof mc[m]}`, typeof mc[m] === 'function' ? 'ok' : 'bad');
  }
  log(`  iframe allow="tools" honored: ${document.featurePolicy?.allowsFeature?.('tools') ?? 'unknown'}`);
};

let crossTools = [];

document.getElementById('cross').onclick = async () => {
  log('--- getTools({ fromOrigins }) ---', 'hdr');
  try {
    crossTools = await document.modelContext.getTools({ fromOrigins: [PROVIDER] });
    log(`returned ${crossTools.length} tool(s)`, crossTools.length ? 'ok' : 'bad');
    for (const t of crossTools) {
      log(`  ${t.name}  origin=${t.origin ?? '(none)'}  readOnlyHint=${t.annotations?.readOnlyHint}`);
    }
  } catch (err) {
    log(`FAILED: ${err?.name}: ${err?.message ?? err}`, 'bad');
  }
};

document.getElementById('exec').onclick = async () => {
  log('--- executeTool ---', 'hdr');
  const tool = crossTools.find(t => t.name === 'spike_echo');
  if (!tool) { log('run step 2 first — spike_echo not discovered', 'bad'); return; }
  const controller = new AbortController();
  try {
    const out = await document.modelContext.executeTool(
      tool,
      JSON.stringify({ message: 'airlock round-trip' }),
      { signal: controller.signal }
    );
    log(`result: ${typeof out === 'string' ? out : JSON.stringify(out)}`, 'ok');
    log('SPIKE PASSES: cross-origin discovery + execution round-tripped.', 'ok');
  } catch (err) {
    log(`FAILED: ${err?.name}: ${err?.message ?? err}`, 'bad');
  }
};


document.getElementById('bare').onclick = async () => {
  log('--- bare getTools() (approximates the agent view of this page) ---', 'hdr');
  try {
    const tools = await document.modelContext.getTools();
    log(`returned ${tools.length} tool(s)`);
    for (const t of tools) log(`  ${t.name}  origin=${t.origin ?? '(none)'}`);
    const foreign = tools.filter(t => t.origin && t.origin !== location.origin);
    if (foreign.length) {
      log(`LEAK: ${foreign.length} iframe tool(s) visible without fromOrigins — proxy mediation is bypassable.`, 'bad');
    } else {
      log('CONTAINED: iframe tools are NOT auto-exposed. Proxy mediation holds.', 'ok');
    }
  } catch (err) {
    log(`FAILED: ${err?.name}: ${err?.message ?? err}`, 'bad');
  }
};

document.getElementById('revoke').onclick = async () => {
  log('--- AbortController unregister ---', 'hdr');
  const ctrl = new AbortController();
  try {
    await document.modelContext.registerTool({
      name: 'spike_temp',
      description: 'Temporary tool used to verify that aborting the registration signal removes it from the tool list.',
      inputSchema: { type: 'object', properties: {}, additionalProperties: false },
      annotations: { readOnlyHint: true },
      execute: async () => 'temp'
    }, { signal: ctrl.signal });
    const before = (await document.modelContext.getTools()).some(t => t.name === 'spike_temp');
    ctrl.abort();
    await new Promise(r => setTimeout(r, 50));
    const after = (await document.modelContext.getTools()).some(t => t.name === 'spike_temp');
    log(`present before abort: ${before}, after abort: ${after}`, before && !after ? 'ok' : 'bad');
  } catch (err) {
    log(`FAILED: ${err?.name}: ${err?.message ?? err}`, 'bad');
  }
};

document.modelContext?.addEventListener?.('toolchange', () => log('toolchange fired'));
</script>
</body>
</html>
